<script>
(function(){

function sparkle(big){var stage=app.querySelector('.stage');if(!stage)return;var old=stage.querySelector('.celebrate-layer');if(old)old.remove();var layer=document.createElement('div');layer.className='celebrate-layer';layer.setAttribute('aria-hidden','true');var count=big?26:11,icons=big?['✨','⭐','💛','🫧','🌟','🐚']:['✨','🫧','⭐'];for(var i=0;i<count;i++){var bit=document.createElement('span');bit.className='celebrate-bit';bit.textContent=icons[i%icons.length];bit.style.setProperty('--x',(6+Math.random()*88)+'%');bit.style.setProperty('--d',(1.3+Math.random()*.9)+'s');bit.style.setProperty('--delay',(Math.random()*.45)+'s');bit.style.setProperty('--drift',(-90+Math.random()*180)+'px');bit.style.setProperty('--spin',(-250+Math.random()*500)+'deg');layer.appendChild(bit)}stage.appendChild(layer);setTimeout(function(){if(layer.parentNode)layer.remove()},3100);var art=stage.querySelector('.big-art,.prompt');if(art){art.classList.add('happy-pop');setTimeout(function(){art.classList.remove('happy-pop')},550)}}

function initTrace(){var c=document.getElementById('trace');if(!c)return;var ctx=c.getContext('2d');ctx.fillStyle='#c8d9e1';ctx.textAlign='center';ctx.font='bold 190px sans-serif';ctx.fillText(chapter===2?'ひ':chapter===1?'か':'う',280,185);ctx.strokeStyle='#488db1';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';var down=false;function pos(e){var r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',function(e){down=true;c.setPointerCapture(e.pointerId);var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});c.addEventListener('pointermove',function(e){if(!down)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();traceMarks++});c.addEventListener('pointerup',function(){down=false});c.addEventListener('pointercancel',function(){down=false})}
function initDrag(){var drop=document.getElementById('drop'),ghost=document.getElementById('ghost');app.querySelectorAll('.fruit').forEach(function(el){el.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;ignoreClick=false;drag={id:Number(el.dataset.v),pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',function(e){if(!drag||drag.pid!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;if(!drag.moved)return;e.preventDefault();ghost.style.display='block';ghost.textContent=animals[drag.id];ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';var r=drop.getBoundingClientRect();drop.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)});el.addEventListener('pointerup',function(e){if(!drag||drag.pid!==e.pointerId)return;var d=drag;drag=null;ghost.style.display='none';drop.classList.remove('over');if(!d.moved)return;ignoreClick=true;var r=drop.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){if(chosen!==d.id)carry=0;chosen=d.id;carry++;if(carry>=quantity){basket.push({id:d.id,count:quantity});carry=0;say(quantity+'こ かごに はいったよ')}else say(carry+'こ');render()}});el.addEventListener('pointercancel',function(){drag=null;ghost.style.display='none';drop.classList.remove('over')})})}
function action(a,v){
if(a==='home'||a==='chapters'||a==='free'||a==='family'||a==='guide'||a==='worksheet'||a==='shop'||a==='countgame'||a==='findgame'||a==='lettergame'||a==='shapegame'||a==='stickers'||a==='voice-settings'){screen=a;feedback='';if(a==='shop'){basket=[];quantity=1;chosen=0;carry=0}render();return}
if(a==='explore'){screen='chapters';render();return}
if(a==='chapter'){start(Number(v));return}
if(a==='jelly'){if(v==='🪼')goto(1);else{feedback='くらげさんを さがしてね！';render();encourage()}return}
if(a==='bubble'){if(Number(v)!==pearls+1)return;pearls++;if(pearls===5)goto(2);else{render();say(pearls+'こ')}return}
if(a==='light'){if(v==='🌟')goto(4);else{feedback='ひかる ほしを さがそう！';render();encourage()}return}
if(a==='turtle'){if(v==='🐢')goto(1);else{feedback='かめさんを さがしてね！';render();encourage()}return}
if(a==='star'){if(Number(v)!==pearls+1)return;pearls++;if(pearls===4)goto(2);else{render();say(pearls+'こ')}return}
if(a==='key'){if(v==='🗝️')goto(4);else{feedback='かぎを さがそう！';render();encourage()}return}
if(a==='letter'){if(v==='う')goto(1);else{feedback='もういちど さがそう！';render();encourage()}return}
if(a==='fish'){if(Number(v)!==fish+1)return;fish++;if(fish===3)goto(2);else{render();say(fish+'びき')}return}
if(a==='path'){if(Number(v)!==path)return;path++;if(path===4)goto(3);else{render();say('すすんだよ')}return}
if(a==='shell'){if(Number(v)===3)goto(4);else{feedback='もういちど かぞえよう';render();encourage()}return}
if(a==='clear'){traceMarks=0;render();return}
if(a==='finish'){if(traceMarks<3){feedback='ゆびで もじを なぞってみよう！';var st=app.querySelector('.status');if(st)st.textContent=feedback;encourage();return}award(chapter===2?'explore3':chapter===1?'explore2':'explore');goto(5);return}
if(a==='count-answer'){if(Number(v)===window.__oceanCount){feedback='せいかい！ すごいね！';award('count');say(feedback);setTimeout(function(){if(screen==='countgame'){feedback='';render()}},1100)}else{feedback='もういちど かぞえよう！';say(feedback)}var el=app.querySelector('.status');if(el)el.textContent=feedback;if(Number(v)===window.__oceanCount)sparkle(false);else encourage();return}
if(a==='find-answer'){if(Number(v)===window.__oceanTarget){feedback='みつけた！ すごいね！';award('find');say(feedback);setTimeout(function(){if(screen==='findgame'){feedback='';render()}},1100)}else{feedback='もういちど さがしてみよう！';say(feedback)}var st=app.querySelector('.status');if(st)st.textContent=feedback;if(Number(v)===window.__oceanTarget)sparkle(false);else encourage();return}
if(a==='voice-toggle'){voiceEnabled=!voiceEnabled;try{localStorage.setItem('manabi-ocean-sound-v1',voiceEnabled?'on':'off')}catch(e){}if(!voiceEnabled&&'speechSynthesis' in window)speechSynthesis.cancel();render();return}
if(a==='voice-preview'){say('こんにちは！ ペンギンと、いっしょに うみを たんけんしよう！');return}
if(a==='letter-answer'){if(v===letters[letterIndex%letters.length]){award('letter');feedback='せいかい！';say('せいかい！');letterIndex++;setTimeout(function(){if(screen==='lettergame'){feedback='';render()}},800)}else{feedback='もういちど！';say('もういちど さがしてみよう')}var st=app.querySelector('.status');if(st)st.textContent=feedback;if(feedback==='せいかい！')sparkle(false);else encourage();return}
if(a==='shape-answer'){if(v===['●','▲','■','★'][shapeIndex%4]){award('shape');feedback='せいかい！';say('せいかい！');shapeIndex++;setTimeout(function(){if(screen==='shapegame'){feedback='';render()}},800)}else{feedback='もういちど！';say('もういちど さがしてみよう')}var st=app.querySelector('.status');if(st)st.textContent=feedback;if(feedback==='せいかい！')sparkle(false);else encourage();return}
if(a==='pick'){if(ignoreClick){ignoreClick=false;return}chosen=Number(v);carry=0;render();say(names[chosen]);return}
if(a==='qty'){quantity=Number(v);carry=0;render();say(quantity+'こ');return}
if(a==='add'){basket.push({id:chosen,count:quantity});carry=0;render();say(quantity+'こ かごに はいったよ');return}

if(a==='checkout'){if(!basket.length){say('かごに いれてね');return}award('shop');screen='thanks';render();say('おかいもの できたね！');return}
if(a==='print'){window.print();return}
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
})();
