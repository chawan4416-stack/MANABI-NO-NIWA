function initDrag(){var drop=document.getElementById('drop'),ghost=document.getElementById('ghost');app.querySelectorAll('.fruit').forEach(function(el){el.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;ignoreClick=false;drag={id:Number(el.dataset.v),pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',function(e){if(!drag||drag.pid!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;if(!drag.moved)return;e.preventDefault();ghost.style.display='block';ghost.textContent=animals[drag.id];ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';var r=drop.getBoundingClientRect();drop.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)});el.addEventListener('pointerup',function(e){if(!drag||drag.pid!==e.pointerId)return;var d=drag;drag=null;ghost.style.display='none';drop.classList.remove('over');if(!d.moved)return;ignoreClick=true;var r=drop.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){if(chosen!==d.id)carry=0;chosen=d.id;carry++;if(carry>=quantity){basket.push({id:d.id,count:quantity});carry=0;say(quantity+'こ かごに はいったよ')}else say(carry+'こ');render()}});el.addEventListener('pointercancel',function(){drag=null;ghost.style.display='none';drop.classList.remove('over')})})}
