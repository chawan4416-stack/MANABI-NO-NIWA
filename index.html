<h2>① 「り」を ゆびで なぞってから、えんぴつで かこう</h2>
<div class="trace">り　り　り</div><div class="writing"></div><div class="writing"></div>
<h2>② りんごは なんこ？ かぞえて まるを つけよう</h2>
<div class="apples">🍎 🍎 🍎</div>
<p style="font-size:25pt">１　　２　　３　　４　　５</p>
<h2>③ うさぎさんに りんごを ３こ かいて あげよう</h2>
<div style="height:150px;border:2px solid #bbb;border-radius:15px"></div>
<p class="printfoot">できたね！　おうちのひとと りんごを かぞえてみよう。</p>
</section>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var screen='home',step=0,apples=0,maze=0,selected=0,shopCount=1,feedback='',completed=false,marketBasket=[],marketDone=false;
try{completed=localStorage.getItem('manabi-first-adventure')==='yes'}catch(e){}
var sceneNames=['orchard','basket','forest','village','writing','celebrate'];
var guideLines=['いっしょに「り」を さがそう！','かごに りんごを 3こ あつめよう！','ぼくと いっしょに すすもう！','おみせに ついたよ！','ゆっくり なぞってみよう！','やったね！ ありがとう！'];
var prompts=['「り」を みつけよう','りんごを 3こ あつめよう','うさぎさんと みちを すすもう','おみせに りんごを とどけよう','「り」を なぞって みよう','やったね！'];
function el(s){return s}
function speak(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function header(back){return '<header class="top"><div class="brand">🌱 まなびのにわ</div><button class="mini" data-action="'+(back||'home')+'">⌂ もどる</button></header>'}
function shell(content){var bg=screen==='adventure'?' adventure-stage':screen==='free'?' free-garden-stage':screen==='shop'?' market-stage':'';var style=screen==='adventure'?' style="--adventure-bg:url(\'./assets/scene-'+sceneNames[step]+'.svg\')"':'';app.innerHTML='<section class="stage'+bg+'"'+style+'>'+content+'</section>';app.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){act(b.dataset.action,b.dataset.value)})});if(screen==='free'){var img=new Image();img.onload=function(){var stage=app.querySelector('.free-garden-stage');if(stage)stage.classList.add('art-ready')};img.src='./assets/free-garden-v04.jpg'}if(screen==='shop'){var shopImage=new Image();shopImage.onload=function(){var stage=app.querySelector('.market-stage');if(stage)stage.classList.add('art-ready')};shopImage.src='./assets/market-v05.png'}}
function navhome(){screen='home';feedback='';render()}
function start(){screen='adventure';step=0;apples=0;maze=0;feedback='';render();speak('うさぎさんと りんごを とどけよう')}
function go(n){step=n;feedback='';render();speak(prompts[n])}
function render(){
if(screen==='home'){shell('<div class="top"><div class="brand">🌱 まなびのにわ</div><button class="mini" data-action="voice">🔊 おはなし</button></div><div class="center"><img class="bunny-art" src="./assets/rabbit.svg" alt="みどりのスカーフをまいた うさぎ"><h1 class="title">わかると、あそびが ひろがる。</h1><div class="bubble">きょうは なにして あそぼうか？</div></div><div class="home-grid"><button class="tile" data-action="start"><span class="pic"><img src="./assets/apple-tree.svg" alt=""></span>ぼうけん<small>いっしょに すすもう</small></button><button class="tile" data-action="free"><span class="pic"><img src="./assets/shop.svg" alt=""></span>じゆうあそび<small>すきな あそびを えらぼう</small></button><button class="tile" data-action="family"><span class="pic"><img src="./assets/rabbit.svg" alt=""></span>かぞく<small>おうちでも あそぼう</small></button></div><div class="footer">🐝 🌼 🌷 🌼 🦋</div>');return}
if(screen==='adventure'){var body='',bar='<div class="progress">'+[0,1,2,3,4,5].map(function(i){return '<span class="dot '+(i<=step?'on':'')+'"></span>'}).join('')+'</div>'; 
if(step===0)body='<img class="story-art" src="./assets/apple-tree.svg" alt="りんごの木">'+ '<p class="sub">りんごの「り」は どれかな？</p><div class="grid">'+['こ','り','い','に'].map(function(x){return '<button class="choice" data-action="letter" data-value="'+x+'">'+x+'</button>'}).join('')+'</div>';
if(step===1)body='<img class="story-art" src="./assets/apple-tree.svg" alt="りんごの木">'+ '<p class="sub">りんごを ひとつずつ タッチしてね</p><div class="grid">'+[1,2,3].map(function(i){return '<button class="choice big" data-action="apple" data-value="'+i+'" '+(i<=apples?'disabled':'')+'>'+(i<=apples?'🧺':'🍎')+'</button>'}).join('')+'</div><div class="counter">'+apples+' / 3 こ</div>';
if(step===2){var cells=['🐰','🌼','🌳','🌳','➡️','🌳','🌳','🌳','➡️','➡️','➡️','🌳','🌳','🌳','🏪','🌳'];var path=[0,4,8,9,10,14];body='<p class="sub">ひかる みちを じゅんばんに タッチしよう</p><div class="maze">'+cells.map(function(c,i){var p=path.indexOf(i),allowed=p>=0&&p<=maze;return '<button class="cell '+(p>=0?'path':'')+'" data-action="maze" data-value="'+i+'" '+(allowed?'':'disabled')+'>'+(p>=0&&p<maze?'👣':c)+'</button>'}).join('')+'</div>'}
if(step===3)body='<img class="story-art" src="./assets/shop.svg" alt="りんごを とどける おみせ">'+ '<p class="sub">りんごを なんこ とどけたかな？</p><div class="grid">'+[1,2,3,4,5].map(function(n){return '<button class="choice" data-action="deliver" data-value="'+n+'">'+n+'</button>'}).join('')+'</div>';
if(step===4)body='<img class="story-art" src="./assets/rabbit.svg" alt="うさぎさん">'+ '<p class="sub">ゆびで「り」を なぞってみよう</p><canvas id="trace" width="560" height="190" style="width:min(100%,560px);height:190px;border:3px dashed #b5c8a3;border-radius:20px;background:#fffef5;touch-action:none" aria-label="り の なぞりがき"></canvas><div class="actions"><button class="secondary" data-action="clear">もういちど</button><button class="primary" data-action="finish">かけたよ！</button></div>';
if(step===5)body='<div class="scene">🎉 🍎 🌷</div>'+ '<p class="lead">りんごを とどけられたね！</p><p class="sub">おみせやさんでも りんごを かぞえてみよう</p><div class="actions"><button class="primary" data-action="free">おみせやさんへ</button><button class="secondary" data-action="home">おうちへ</button></div>';
shell(header('home')+'<div class="center"><h1 class="title">🍎 はじめての ぼうけん</h1>'+bar+'<div class="adventure-hero"><img class="guide-rabbit" src="./assets/rabbit-'+sceneNames[step]+'.svg" alt="いっしょに ぼうけんする うさぎ"><div class="guide-message">'+guideLines[step]+'</div></div><div class="card"><div class="scene-label">'+(step+1)+' / 6</div><div class="lead">'+prompts[step]+'</div>'+body+'<div class="hint" role="status">'+feedback+'</div></div></div>');
if(step===4)initCanvas();return}
if(screen==='free'){shell('<div class="free-garden"><div class="free-fallback">🌷 じゆうあそびのにわ</div><button class="free-back" data-action="home" aria-label="もどる">もどる</button><div class="free-choices"><button class="free-choice" data-action="shop" aria-label="おみせやさん"><span class="free-choice-label">おみせやさん</span></button><button class="free-choice" data-action="coming-craft" aria-label="つくってあそぼう"><span class="free-choice-label">つくってあそぼう</span></button><button class="free-choice" data-action="coming-games" aria-label="ミニゲーム"><span class="free-choice-label">ミニゲーム</span></button></div>'+(feedback?'<div class="free-pending" role="status">'+feedback+'</div>':'')+'</div>');return}
if(screen==='shop'){var fruits=[['🍎','りんご'],['🍌','バナナ'],['🍇','ぶどう'],['🍓','いちご'],['🍊','みかん']];var total=marketBasket.reduce(function(n,item){return n+item.count},0);var basket=marketBasket.map(function(item){return '<span class="fruit-token" aria-label="'+fruits[item.id][1]+' '+item.count+'こ">'+fruits[item.id][0]+'×'+item.count+'</span>'}).join('');var message=marketDone?'おかいもの できたね！ 🎉':total?'かごに '+total+'こ！ おかいけい しよう':'どの くだものに する？';shell('<div class="market"><div class="market-fallback">🍎 おみせやさん</div><button class="market-back" data-action="free" aria-label="じゆうあそびにもどる">⌂ もどる</button>'+fruits.map(function(f,i){return '<button class="market-fruit '+(selected===i?'is-selected':'')+'" data-action="select" data-value="'+i+'" aria-label="'+f[1]+'をえらぶ">'+f[0]+' '+f[1]+'</button>'}).join('')+[1,2,3,4,5].map(function(n){return '<button class="market-number '+(shopCount===n?'is-selected':'')+'" data-action="market-quantity" data-value="'+n+'" aria-label="'+n+'こ">'+n+'</button>'}).join('')+'<div class="market-message" role="status">'+message+'</div><div class="market-basket" aria-label="かいものかご">'+(basket||'<span class="fruit-token">🧺</span>')+'</div><div class="market-receipt"><span>'+(marketDone?'ありがとう！':total+'こ')+'</span>'+(total&&!marketDone?'<button data-action="market-clear">やりなおす</button>':'')+'</div><button class="market-add" data-action="'+(marketDone?'market-restart':total?'market-checkout':'market-add')+'" aria-label="'+(marketDone?'もういちど あそぶ':total?'おかいけいする':'かごにいれる')+'">'+(marketDone?'もういちど':total?'おかいけい':'かごにいれる')+'</button></div>');return}
if(screen==='family'){shell(header()+'<div class="center"><h1 class="title">🏡 かぞくのにわ</h1><div class="bubble">おうちでも いっしょに あそぼう！</div><div class="home-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="tile" data-action="guide"><span class="pic">📖</span>あそびかたガイド</button><button class="tile" data-action="worksheet"><span class="pic">🖍️</span>プリントあそび</button></div></div>');return}
if(screen==='guide'){shell(header('family')+'<div class="center"><h1 class="title">📖 おうちで あそぼう</h1><div class="card"><img class="bunny-art" src="./assets/rabbit.svg" alt="みどりのスカーフをまいた うさぎ"><p class="lead">りんごを 3こ かぞえてみよう！</p><p class="sub">おやつを3個お皿に並べたり、家族に「3個ください」とお願いしてみよう。<br>実物の硬貨を使う遊びは、もう少し大きくなってからでも大丈夫。</p><div class="actions"><button class="primary" data-action="worksheet">プリントでも あそぶ</button></div></div></div>');return}
if(screen==='worksheet'){shell(header('family')+'<div class="center"><h1 class="title">🖍️ プリントあそび</h1><div class="card"><img class="story-art" src="./assets/rabbit.svg" alt="うさぎさん"><p class="lead">りんごの おてがみ</p><p class="sub">「り」を書いて、りんごを3個数えるA4プリントだよ。<br>印刷はおうちの人と一緒にね。</p><div class="actions"><button class="primary" data-action="print">A4で いんさつ</button></div></div></div>');return}
}
function initCanvas(){var c=document.getElementById('trace'),ctx=c.getContext('2d');ctx.fillStyle='#d6dcc9';ctx.font='bold 170px sans-serif';ctx.textAlign='center';ctx.fillText('り',280,155);ctx.strokeStyle='#669d73';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';var drawing=false;function pos(e){var r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',function(e){drawing=true;c.setPointerCapture(e.pointerId);var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});c.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});c.addEventListener('pointerup',function(){drawing=false});c.addEventListener('pointercancel',function(){drawing=false})}
function act(a,v){
if(a==='home')return navhome();
if(a==='voice'){speak('きょうは なにして あそぼうか？');return}
if(a==='start')return start();
if(a==='free'||a==='family'||a==='shop'||a==='guide'||a==='worksheet'){screen=a;feedback='';if(a==='shop'){marketBasket=[];marketDone=false;selected=0;shopCount=1}render();return}
if(a==='soon'||a==='coming-craft'||a==='coming-games'){feedback='この あそびは じゅんびちゅうだよ 🌷';render();speak('この あそびは じゅんびちゅうだよ');return}
if(a==='letter'){if(v==='り')return go(1);feedback='もういちど さがしてみよう';render();return}
if(a==='apple'){if(Number(v)!==apples+1){feedback='ひとつずつ あつめよう';render();return}apples++;if(apples===3)return go(2);render();speak(apples+'こ');return}
if(a==='maze'){var path=[0,4,8,9,10,14];if(Number(v)!==path[maze])return;maze++;if(maze===path.length)return go(3);render();return}
if(a==='deliver'){if(Number(v)===3)return go(4);feedback='りんごを もういちど かぞえてみよう';render();return}
if(a==='clear'){render();return}
if(a==='finish'){completed=true;try{localStorage.setItem('manabi-first-adventure','yes')}catch(e){}return go(5)}
if(a==='select'){selected=Number(v);marketDone=false;render();speak(['りんご','バナナ','ぶどう','いちご','みかん'][selected]);return}
if(a==='market-quantity'){shopCount=Number(v);render();speak(shopCount+'こ');return}
if(a==='market-add'){marketBasket.push({id:selected,count:shopCount});shopCount=1;render();speak('かごに いれたよ');return}
if(a==='market-clear'){marketBasket=[];marketDone=false;shopCount=1;render();return}
if(a==='market-checkout'){marketDone=true;render();speak('おかいもの できたね！ ありがとう');return}
if(a==='market-restart'){marketBasket=[];marketDone=false;selected=0;shopCount=1;render();return}
if(a==='minus'){shopCount=Math.max(1,shopCount-1);render();return}
if(a==='plus'){shopCount=Math.min(10,shopCount+1);render();return}
if(a==='buy'){feedback='ありがとう！ '+shopCount+'こ どうぞ！';render();speak(feedback);return}
if(a==='print'){window.print();return}
}
render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(e){console.warn("offline unavailable",e)})})}</script>
</body>
</html>
